<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goal progress</title>
<style>
:root{
  --bg:#ffffff;--panel:#fafafb;--raise:#f4f5f6;--hover:#f1f2f4;--line:#e8e9ec;--line2:#dcdee2;
  --text:#1c1d20;--text2:#4a4d54;--muted:#80848c;--accent:#5b66d6;--accent-bg:#eceefc;--on:#fff;
  --todo:#8a8e96;--active:#d29a0b;--review:#2f9e6b;--done:#5b66d6;--blocked:#d9731f;--failed:#d94646;
  --shadow:0 1px 2px rgba(16,17,20,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1012;--panel:#141518;--raise:#1a1b1f;--hover:#1b1c20;--line:#232529;--line2:#2c2e34;
    --text:#eef0f2;--text2:#b8bcc3;--muted:#7b8089;--accent:#8590f5;--accent-bg:#1c1e33;--on:#fff;
    --todo:#7b8089;--active:#f0b940;--review:#4cc38a;--done:#7b86f0;--blocked:#f09050;--failed:#f06a6a;
    --shadow:none;
  }
}
:root[data-theme=light]{--bg:#ffffff;--panel:#fafafb;--raise:#f4f5f6;--hover:#f1f2f4;--line:#e8e9ec;--line2:#dcdee2;--text:#1c1d20;--text2:#4a4d54;--muted:#80848c;--accent:#5b66d6;--accent-bg:#eceefc;--todo:#8a8e96;--active:#d29a0b;--review:#2f9e6b;--done:#5b66d6;--blocked:#d9731f;--failed:#d94646}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 "Inter var",Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding-left:16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.muted{color:var(--muted)}.t2{color:var(--text2)}.small{font-size:12px}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:12px}
svg{display:block;flex:none}
.ic{display:inline-flex;color:var(--c,var(--todo))}
.ic svg{overflow:visible}

/* status colour hooks */
.s-todo{--c:var(--todo)}.s-active{--c:var(--active)}.s-review{--c:var(--review)}.s-blocked{--c:var(--blocked)}
.s-failed{--c:var(--failed)}.s-done{--c:var(--done)}.s-dropped{--c:var(--todo)}
.h-on-track{--c:var(--review)}.h-complete{--c:var(--done)}.h-at-risk{--c:var(--active)}.h-blocked{--c:var(--failed)}.h-planning{--c:var(--todo)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.app.solo{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;font-weight:600;font-size:13px;letter-spacing:-.01em}
.brand i{width:16px;height:16px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.brand i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--on)}
.side-h{padding:14px 8px 4px;font-size:11px;color:var(--muted);font-weight:500}
.nav{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:6px;color:var(--text2);min-height:28px}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current=page]{background:var(--raise);color:var(--text)}
.nav .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .badge{font-size:11px;font-weight:600;color:var(--blocked);min-width:16px;text-align:right}
.side-ft{margin-top:auto;padding:10px 8px 2px}
.main{min-width:0}
.bar-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;padding:0 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted)}
.crumb b{font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{color:var(--muted);border-radius:4px;padding:2px 4px;margin-left:-4px}
.back:hover{color:var(--text);background:var(--hover)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--todo)}
.live.on i{background:var(--review);box-shadow:0 0 0 3px color-mix(in srgb,var(--review) 22%,transparent)}
.live.offline i{background:var(--failed)}
.page{max-width:1000px;margin:0 auto;padding:28px 24px 80px}
.solo .page{max-width:1000px}

/* title block */
h1{font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
.sub{margin-top:6px;color:var(--text2);max-width:70ch;font-size:14px;line-height:1.55}
.props{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;margin-top:16px}
.prop{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:6px;color:var(--text2);font-size:12px;white-space:nowrap}
.prop b{font-weight:500;color:var(--text)}
.prop .ic{color:var(--c)}

/* sections */
.sec{margin-top:24px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;min-height:28px}
h2{font-size:13px;font-weight:600;letter-spacing:-.005em}
h2 .n{color:var(--muted);font-weight:500;margin-left:6px}
.tabs{display:inline-flex;gap:2px}
.tabs button{padding:3px 9px;border-radius:6px;color:var(--muted);font-size:12px;font-weight:500}
.tabs button:hover{color:var(--text);background:var(--hover)}
.tabs button[aria-pressed=true]{color:var(--text);background:var(--raise)}
.tabs .n{margin-left:5px;opacity:.7}
.box{border:1px solid var(--line);border-radius:8px;background:var(--bg)}

/* update */
.update{padding:14px 16px}
.up-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.up-hd b{color:var(--c);font-weight:600}
.summary{font-size:14px;line-height:1.6;white-space:pre-wrap;max-width:75ch}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cols2 h3{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.cols2 li{margin:2px 0;color:var(--text2)}
.cols2 .risks li::marker{color:var(--blocked)}

/* glance */
.sum{display:flex;align-items:center;gap:12px;margin-top:20px}
.sum .stack{flex:1;height:8px;border-radius:4px}
.hl{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--c)}
.hl i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pct{font-size:14px;font-weight:600}
.counts{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px;color:var(--text2)}
.counts b{font-weight:600;color:var(--text)}
.counts .hot,.counts .hot b{color:var(--blocked)}
.counts .grow{margin-left:auto}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.update{cursor:pointer;padding:12px 16px}.update:hover{background:var(--hover)}
.summary{font-size:13px;line-height:1.55}
.dis{display:flex;align-items:center;gap:8px;width:100%;min-height:28px;border-radius:6px}
.dis:hover h2{color:var(--accent)}
.dis .chev{color:var(--muted);transition:transform .15s;display:inline-block;width:10px}
.dis[aria-expanded=true] .chev{transform:rotate(90deg)}
.dis .muted{font-size:12px}
.dis+.box{margin-top:8px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as{cursor:pointer;padding:8px 14px}.as:hover{background:var(--hover)}
.as .detail{padding:6px 0 4px 44px}
.grp .mini{width:64px;margin-left:auto}
.grp{gap:10px}
.s-done .tr,.s-dropped .tr{opacity:.8}
/* progress */
.prog{padding:14px 16px}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--raise);gap:2px}
.stack span{display:block;min-width:4px;transition:width .4s ease}
.seg-done{background:var(--done)}.seg-review{background:var(--review)}.seg-active{background:var(--active)}.seg-blocked{background:var(--blocked)}.seg-failed{background:var(--failed)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--text);font-weight:500}
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 24px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.phase{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;align-items:center;gap:10px;font-size:12px}
.phase>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.mini{height:4px;border-radius:2px;background:var(--raise);overflow:hidden}
.mini span{display:block;height:100%;background:var(--done)}

/* attention */
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow:hover{background:var(--hover)}
.arow .k{font-size:12px;font-weight:600;color:var(--c);display:inline-flex;align-items:center;gap:7px;min-width:132px}
.arow .k i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.arow .tx{min-width:0;color:var(--text)}
.arow .tx .mono{color:var(--muted);margin-right:6px}
.arow .chips{display:flex;gap:5px}
.a-q{--c:var(--review)}.a-blocked{--c:var(--blocked)}.a-failed{--c:var(--failed)}.a-assumption{--c:var(--active)}
.attn{border-color:color-mix(in srgb,var(--blocked) 35%,var(--line))}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 6px;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.chip.ready{color:var(--review);border-color:color-mix(in srgb,var(--review) 35%,var(--line))}
.chip.warn{color:var(--blocked);border-color:color-mix(in srgb,var(--blocked) 40%,var(--line))}
.lvl-low,.lvl-high-impact{color:var(--blocked);border-color:color-mix(in srgb,var(--blocked) 40%,var(--line))}
.lvl-good,.rs-confirmed{color:var(--review);border-color:color-mix(in srgb,var(--review) 35%,var(--line))}
.rs-rejected{color:var(--failed);border-color:color-mix(in srgb,var(--failed) 40%,var(--line))}
.rs-revised{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.link{color:var(--accent);font-weight:500;font-size:inherit}
.link:hover{text-decoration:underline}
.av{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:600;color:var(--on);background:var(--avc,var(--todo));flex:none}
.own{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:12px;min-width:0}
.own span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* task list */
.grp{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px}
.grp:first-child{border-top:0;border-radius:8px 8px 0 0}
.grp b{font-weight:600}.grp .n{color:var(--muted)}
.trow{border-top:1px solid var(--line);cursor:pointer;scroll-margin:80px}
.trow:hover{background:var(--hover)}
.tr{display:grid;grid-template-columns:16px 52px minmax(0,1fr) auto 128px 56px;gap:10px;align-items:center;min-height:38px;padding:6px 14px}
.tid{color:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.ttl{min-width:0;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-done .ttl,.s-dropped .ttl{color:var(--text2)}
.s-dropped .ttl{text-decoration:line-through}
.tr .chips{display:flex;gap:5px;justify-content:flex-end}
.when{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.sub-line{padding:0 14px 8px 92px;margin-top:-2px;font-size:12px;color:var(--muted)}
.s-blocked .sub-line,.s-failed .sub-line{color:var(--c)}
.detail{padding:4px 14px 12px 92px;display:grid;gap:8px;font-size:12px;color:var(--text2);cursor:default}
.hist{display:grid;gap:3px;color:var(--muted);border-left:1px solid var(--line2);padding-left:10px}
.hist b{color:var(--text2);font-weight:500}
.flash{animation:flash 1.8s ease-out}
.more{display:block;width:100%;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.more:hover{color:var(--text);background:var(--hover)}
.empty{padding:14px;color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto;align-items:start;padding-bottom:4px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:80px}
.col-hd{display:flex;align-items:center;gap:7px;padding:4px 6px 8px;font-size:12px;font-weight:600}
.col-hd .n{color:var(--muted);font-weight:500}
.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer;box-shadow:var(--shadow);scroll-margin:80px}
.card:hover{border-color:var(--line2)}
.card .tid{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.card h4{font-size:13px;font-weight:500;line-height:1.4}
.card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.card .res{margin-top:6px;font-size:12px;color:var(--muted)}
.card .detail{padding:8px 0 0;margin-top:8px;border-top:1px solid var(--line)}

/* assumptions */
.as{padding:10px 14px;border-top:1px solid var(--line);scroll-margin:80px}
.as:first-child{border-top:0}
.as-top{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:baseline}
.as .id{color:var(--muted)}
.as h4{font-size:13px;font-weight:500;line-height:1.45}
.as .chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.as .why{margin:4px 0 0 44px;font-size:12px;color:var(--muted);max-width:78ch}
.as .why b{color:var(--text2);font-weight:500}
.as.risky{box-shadow:inset 2px 0 0 var(--blocked)}
.as.closed h4{color:var(--text2)}

/* activity */
.ev{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;padding:7px 14px;border-top:1px solid var(--line);align-items:center;font-size:12px}
.ev:first-child{border-top:0}
.ev .g{color:var(--c,var(--muted));display:inline-grid;place-items:center;width:16px;font-size:11px;line-height:1}
.ev .by{color:var(--muted)}
.k-assume,.k-risk{--c:var(--active)}.k-ask,.k-answer{--c:var(--review)}.k-decision,.k-report,.k-goal,.k-plan{--c:var(--accent)}

/* goal list */
.gh,.gcard{display:grid;grid-template-columns:18px minmax(0,1fr) 98px 150px 96px 64px;gap:12px;align-items:center;padding:0 14px}
.gh{height:30px;background:var(--panel);border-radius:8px 8px 0 0;font-size:12px;color:var(--muted)}
.gcard{min-height:52px;border-top:1px solid var(--line);cursor:pointer;padding-top:8px;padding-bottom:8px}
.gcard:hover{background:var(--hover)}
.gc-t{min-width:0}
.gc-t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-t span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-p{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.gc-p .stack{flex:1;height:4px}
.hp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.hp i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.onboard{padding:18px}
.onboard p{color:var(--text2)}
.onboard code{display:block;margin-top:8px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto}
.foot{margin-top:40px;color:var(--muted);font-size:12px}
.mtop{display:none}

@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:inline}
  .page{padding:20px 16px 64px}
  .bar-top{padding:0 16px}
  .cols2{grid-template-columns:1fr}
  .tr{grid-template-columns:16px 44px minmax(0,1fr) 48px}
  .tr .chips,.tr .own{display:none}
  .sub-line,.detail{padding-left:70px}
  .gh{display:none}
  .gcard{grid-template-columns:18px minmax(0,1fr) 86px}
  .gcard>:nth-child(3),.gcard>:nth-child(6){display:none}
  .arow{grid-template-columns:minmax(0,1fr)}
  .arow .k{min-width:0}
  .as-top{grid-template-columns:30px minmax(0,1fr)}
  .as .chips{grid-column:2;justify-content:flex-start}
  .as .why{margin-left:40px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
window.__GP_DATA__ = /*__GP_DATA__*/null;
(function () {
  'use strict';

  var INITIAL = window.__GP_DATA__;
  var LIVE = INITIAL == null;
  var data = INITIAL;            // { goals: [state, ...] }
  var state = null;              // the goal currently on screen
  var conn = LIVE ? 'connecting' : 'snapshot';
  var ui = { view: 'list', open: {}, expanded: {}, more: {}, showArchived: false, nav: undefined };
  var seen = null;               // task id -> "status|updatedAt", used to flash changes
  var seenGoal = null;
  var QUIET_MIN = 30;            // live only: active/review tasks with no update for this long get a chip

  try { var v = localStorage.getItem('gp.view'); if (v === 'board' || v === 'list') ui.view = v; } catch (e) {}

  var ST = {
    todo:    { label: 'To do' },
    active:  { label: 'In progress' },
    review:  { label: 'In review' },
    blocked: { label: 'Blocked' },
    failed:  { label: 'Failed' },
    done:    { label: 'Done' },
    dropped: { label: 'Dropped' }
  };
  var HEALTH = { 'on-track': 'On track', 'at-risk': 'At risk', blocked: 'Blocked', complete: 'Complete', planning: 'Planning' };
  var KIND_GLYPH = { goal: '◆', plan: '≡', assume: '~', resolve: '✓', note: '•', decision: '◆', finding: '◇', risk: '▲',
    ask: '?', answer: '✓', report: '¶', resume: '↻', archive: '▤', unarchive: '▤' };
  var AV = ['#5b66d6', '#2f9e6b', '#d29a0b', '#d9731f', '#c2478b', '#3b8fc9', '#8a63d2', '#4aa3a0'];

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var cap = function (s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; };

  function ago(ts) {
    if (!ts) return '';
    var d = (Date.now() - new Date(ts).getTime()) / 1000;
    if (d < 5) return 'now';
    if (d < 60) return Math.floor(d) + 's';
    if (d < 3600) return Math.floor(d / 60) + 'm';
    if (d < 86400) return Math.floor(d / 3600) + 'h';
    return Math.floor(d / 86400) + 'd';
  }
  function agoLong(ts) { var a = ago(ts); return !a ? '' : a === 'now' ? 'just now' : a + ' ago'; }
  function span(a, b) {
    var d = Math.max(0, (new Date(b).getTime() - new Date(a).getTime()) / 1000);
    if (d < 60) return Math.round(d) + 's';
    if (d < 3600) return Math.round(d / 60) + 'm';
    var h = d / 3600;
    return h < 48 ? (Math.round(h * 10) / 10) + 'h' : Math.round(h / 24) + 'd';
  }

  /* ---------- small visual parts ---------- */

  // Status glyphs: outline = not started, filling pie = progress, solid check = done.
  function icon(st, size) {
    size = size || 14;
    var ring = '<circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5"' + (st === 'todo' ? ' stroke-dasharray="2.4 2.2"' : '') + '/>';
    var inner = '';
    if (st === 'active') inner = '<path d="M7 3.6a3.4 3.4 0 0 1 0 6.8z" fill="currentColor"/>';
    else if (st === 'review') inner = '<path d="M7 7V3.6A3.4 3.4 0 1 1 3.6 7z" fill="currentColor"/>';
    else if (st === 'blocked') inner = '<path d="M4.6 7h4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
    else if (st === 'dropped') inner = '<path d="M4.8 9.2l4.4-4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';
    if (st === 'done') {
      ring = '<circle cx="7" cy="7" r="6.4" fill="currentColor"/>';
      inner = '<path d="M4.3 7.2l1.9 1.9 3.5-3.9" fill="none" stroke="var(--on)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
    } else if (st === 'failed') {
      ring = '<circle cx="7" cy="7" r="6.4" fill="currentColor"/>';
      inner = '<path d="M4.9 4.9l4.2 4.2M9.1 4.9L4.9 9.1" stroke="var(--on)" stroke-width="1.5" stroke-linecap="round"/>';
    }
    return '<span class="ic s-' + st + '" aria-hidden="true"><svg width="' + size + '" height="' + size + '" viewBox="0 0 14 14">' + ring + inner + '</svg></span>';
  }

  function ring(pct, health) {
    var r = 5.5, c = 2 * Math.PI * r;
    return '<span class="ic h-' + esc(health) + '" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16">' +
      '<circle cx="8" cy="8" r="' + r + '" fill="none" stroke="var(--line2)" stroke-width="2"/>' +
      '<circle cx="8" cy="8" r="' + r + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 8 8)"/></svg></span>';
  }

  function avatar(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return '<span class="av" style="--avc:' + AV[h % AV.length] + '">' + esc(name.charAt(0).toUpperCase()) + '</span>';
  }
  function owner(name) { return name ? '<span class="own">' + avatar(name) + '<span>' + esc(name) + '</span></span>' : '<span class="own"></span>'; }

  function stack(c, total, titles) {
    if (!total) return '';
    return ['done', 'review', 'active', 'blocked', 'failed'].filter(function (k) { return c[k]; }).map(function (k) {
      return '<span class="seg-' + k + '" style="width:' + (100 * c[k] / total) + '%"' + (titles ? ' title="' + ST[k].label + ': ' + c[k] + '"' : '') + '></span>';
    }).join('');
  }

  function connLabel() {
    var label = { live: 'Live', connecting: 'Connecting', offline: 'Offline, retrying', snapshot: 'Snapshot' }[conn];
    return '<span class="live ' + (conn === 'live' ? 'on' : conn === 'offline' ? 'offline' : '') + '"><i></i>' + label + '</span>';
  }

  /* ---------- shell ---------- */

  function sidebar(goals, cur) {
    var open = goals.filter(function (g) { return !g.archived; });
    var archived = goals.filter(function (g) { return g.archived; });
    open.sort(function (a, b) { return goalRank(a) - goalRank(b) || new Date(b.updatedAt) - new Date(a.updatedAt); });
    function item(g) {
      var n = g.attention.length;
      return '<div class="nav" role="button" tabindex="0" data-act="open" data-v="' + esc(g.slug) + '"' + (cur && cur.slug === g.slug ? ' aria-current="page"' : '') + '>' +
        ring(g.progress.pct, g.health.value) + '<span class="t">' + esc(g.goal ? g.goal.title : g.slug) + '</span>' + (n ? '<span class="badge" title="Needs you">' + n + '</span>' : '') + '</div>';
    }
    return '<nav class="side" aria-label="Goals"><div class="brand"><i></i>goalpulse</div>' +
      '<div class="nav" role="button" tabindex="0" data-act="home"' + (!cur ? ' aria-current="page"' : '') + '><span class="t">All goals</span></div>' +
      '<div class="side-h">Active</div>' + open.map(item).join('') +
      (archived.length ? '<div class="side-h">Archived</div>' + archived.map(item).join('') : '') +
      '<div class="side-ft">' + connLabel() + '</div></nav>';
  }

  function topbar(multi, title) {
    return '<div class="bar-top"><div class="crumb">' +
      (multi ? '<button class="back" data-act="home"><span class="mtop">‹ </span>Goals</button><span>/</span>' : '<span>goalpulse</span><span>/</span>') +
      '<b>' + esc(title) + '</b></div>' + connLabel() + '</div>';
  }

  /* ---------- goal view ---------- */

  function header(s) {
    var g = s.goal;
    return '<h1>' + esc(g ? g.title : 'No goal set yet') + (s.archived ? ' <span class="chip">archived</span>' : '') + '</h1>' +
      (g && g.desc ? '<p class="sub">' + esc(g.desc) + '</p>' : '');
  }

  // The glance: one line of status, one bar, one line of counts.
  function summary(s) {
    var p = s.progress, c = s.counts, h = s.health.value;
    var done = h === 'complete';
    var ready = s.tasks.filter(function (t) { return t.status === 'todo' && t.ready; }).length;
    var parts = [
      [(c.active || 0) + (c.review || 0), 'running', ''], [(c.blocked || 0) + (c.failed || 0), 'blocked', 'hot'],
      [ready, 'ready', ''], [s.attention.length, 'need you', 'hot']
    ].filter(function (x) { return x[0]; }).map(function (x) { return '<span class="' + x[2] + '"><b>' + x[0] + '</b> ' + x[1] + '</span>'; });
    var when = s.updatedAt ? (done ? 'took ' + span(s.startedAt, s.updatedAt) : 'updated ' + agoLong(s.updatedAt)) : '';
    return '<div class="sum"><span class="hl h-' + esc(h) + '"><i></i>' + esc(HEALTH[h] || h) + '</span><b class="pct">' + p.pct + '%</b>' +
      '<div class="stack" role="img" aria-label="' + p.pct + ' percent complete">' + stack(c, p.total, true) + '</div>' +
      '<span class="muted">' + p.done + '/' + p.total + '</span></div>' +
      '<div class="counts">' + parts.join('') + '<span class="muted grow">' + esc(when) + '</span></div>';
  }

  // Coordinator note: two lines until clicked.
  function reportSection(s) {
    var r = s.report;
    if (!r) return '';
    var open = ui.expanded.report;
    var behind = s.tasks.filter(function (t) { return new Date(t.updatedAt) > new Date(r.ts); }).length;
    return '<section class="sec"><div class="box update" role="button" tabindex="0" aria-expanded="' + !!open + '" data-act="toggle" data-v="report">' +
      '<div class="up-hd">Coordinator · ' + esc(agoLong(r.ts)) +
      (behind ? '<span class="chip warn" title="Tasks changed after this update was written">' + behind + ' changed since</span>' : '') + '</div>' +
      '<p class="summary' + (open ? '' : ' clamp') + '">' + esc(r.summary) + '</p>' +
      (open && ((r.next && r.next.length) || (r.risks && r.risks.length)) ? '<div class="cols2">' +
        '<div>' + (r.next && r.next.length ? '<h3>Next up</h3><ul>' + r.next.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>' +
        '<div>' + (r.risks && r.risks.length ? '<h3>Risks</h3><ul class="risks">' + r.risks.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div></div>' : '') +
      '</div></section>';
  }

  // A collapsed section is one line: chevron, title, a hint of what is inside.
  function disc(key, title, meta, body, open) {
    return '<section class="sec"><button class="dis" data-act="sect" data-v="' + key + '" aria-expanded="' + open + '"><span class="chev">›</span><h2>' + title + '</h2><span class="muted">' + meta + '</span></button>' +
      (open ? body : '') + '</section>';
  }

  function attention(s) {
    if (!s.attention.length) return '';
    var items = s.attention.map(function (a) {
      var cls = a.kind === 'question' ? 'a-q' : 'a-' + a.kind;
      var k = { question: 'Question', blocked: 'Blocked', failed: 'Failed', assumption: 'Confirm assumption' }[a.kind];
      var target = a.kind === 'assumption' ? 'assume:' + a.id : a.task ? 'task:' + a.task : '';
      var chips = a.kind === 'assumption' ? '<span class="chips"><span class="chip ' + (a.confidence === 'low' ? 'lvl-low' : '') + '">confidence ' + esc(a.confidence) + '</span><span class="chip ' + (a.impact === 'high' ? 'lvl-high-impact' : '') + '">impact ' + esc(a.impact) + '</span></span>' : '<span></span>';
      return '<button class="arow ' + cls + '" data-act="jump" data-v="' + esc(target) + '"><span class="k"><i></i>' + k + '</span>' +
        '<span class="tx"><span class="mono">' + esc(a.id) + '</span>' + esc(a.title ? a.title + ': ' : '') + esc(a.text) + '</span>' + chips + '</button>';
    }).join('');
    return '<section class="sec"><div class="sec-hd"><h2>Needs your attention<span class="n">' + s.attention.length + '</span></h2></div><div class="box attn">' + items + '</div></section>';
  }

  function taskChips(t, s) {
    var meta = '';
    if (t.ready) meta += '<span class="chip ready">ready</span>';
    if (LIVE && (t.status === 'active' || t.status === 'review')) {
      var quiet = (Date.now() - new Date(t.updatedAt).getTime()) / 60000;
      if (quiet > QUIET_MIN) meta += '<span class="chip warn" title="No update for a while; the agent may have stopped">quiet ' + (quiet < 120 ? Math.round(quiet) + 'm' : Math.round(quiet / 60) + 'h') + '</span>';
    }
    if (t.waitingOn && t.waitingOn.length) meta += '<span class="chip">waits on ' + esc(t.waitingOn.join(', ')) + '</span>';
    var risky = s.assumptions.filter(function (a) { return a.task === t.id && a.status === 'open'; });
    if (risky.length) meta += '<span class="chip ' + (risky.some(function (a) { return a.confidence === 'low' || a.impact === 'high'; }) ? 'warn' : '') + '">' + risky.length + ' assumption' + (risky.length > 1 ? 's' : '') + '</span>';
    if (t.phase && !(s.phases && s.phases.length > 1)) meta += '<span class="chip">' + esc(t.phase) + '</span>';
    return meta;
  }

  function taskDetail(t, s) {
    var linked = s.assumptions.filter(function (a) { return a.task === t.id; });
    return '<div class="detail">' +
      (t.desc ? '<div>' + esc(t.desc) + '</div>' : '') +
      (t.deps && t.deps.length ? '<div><span class="muted">Depends on</span> ' + esc(t.deps.join(', ')) + '</div>' : '') +
      (t.status !== 'done' && t.result ? '<div>' + esc(t.result) + '</div>' : '') +
      (linked.length ? '<div>' + linked.map(function (a) { return '<button class="link" data-act="jump" data-v="assume:' + esc(a.id) + '">' + esc(a.id) + '</button> ' + esc(a.text); }).join('<br>') + '</div>' : '') +
      '<div class="hist">' + t.history.slice(-6).map(function (h) {
        return '<div><b>' + esc(ST[h.status] ? ST[h.status].label : h.status) + '</b>' + (h.by ? ' · ' + esc(h.by) : '') + ' · ' + esc(agoLong(h.ts)) + (h.text ? ': ' + esc(h.text) : '') + '</div>';
      }).join('') + '</div></div>';
  }

  function taskNote(t) {
    if (t.status === 'blocked' || t.status === 'failed') return t.blocker || '';
    return '';
  }

  function taskRow(t, s, flashIds) {
    var open = ui.expanded['task:' + t.id];
    var who = t.status === 'review' ? (t.reviewer || t.owner) : t.owner;
    var note = taskNote(t);
    return '<div class="trow s-' + t.status + (flashIds[t.id] ? ' flash' : '') + '" id="task-' + esc(t.id) + '" role="button" tabindex="0" aria-expanded="' + !!open + '" data-act="toggle" data-v="task:' + esc(t.id) + '">' +
      '<div class="tr">' + icon(t.status) + '<span class="tid">' + esc(t.id) + '</span><span class="ttl">' + esc(t.title) + '</span>' +
      '<span class="chips">' + taskChips(t, s) + '</span>' + owner(who) + '<span class="when">' + esc(ago(t.updatedAt)) + '</span></div>' +
      (note && !open ? '<div class="sub-line">' + esc(note) + '</div>' : '') + (open ? taskDetail(t, s) : '') + '</div>';
  }

  var RANK = { blocked: 0, failed: 1, active: 2, review: 3, todo: 4, done: 5, dropped: 6 };
  function byRank(a, b) {
    return RANK[a.status] - RANK[b.status] || (a.status === 'todo' ? (b.ready ? 1 : 0) - (a.ready ? 1 : 0) : 0) || new Date(b.updatedAt) - new Date(a.updatedAt);
  }
  function phaseOf(t) { return t.phase || 'Other'; }

  function listView(s, flashIds) {
    var names = (s.phases || []).map(function (p) { return p.name; });
    s.tasks.forEach(function (t) { if (names.indexOf(phaseOf(t)) < 0) names.push(phaseOf(t)); });
    var single = names.length < 2;
    var out = '';
    names.forEach(function (name) {
      var list = s.tasks.filter(function (t) { return phaseOf(t) === name; }).sort(byRank);
      if (!list.length) return;
      var closed = list.filter(function (t) { return t.status === 'done' || t.status === 'dropped'; });
      var live = list.filter(function (t) { return closed.indexOf(t) < 0; });
      var open = ui.more['p:' + name];
      var d = list.filter(function (t) { return t.status === 'done'; }).length;
      if (!single) out += '<div class="grp"><b>' + esc(name) + '</b><span class="mini"><span style="width:' + (100 * d / list.length) + '%"></span></span><span class="n">' + d + '/' + list.length + '</span></div>';
      out += (open ? list : live).map(function (t) { return taskRow(t, s, flashIds); }).join('') +
        (closed.length ? '<button class="more" data-act="more" data-v="p:' + esc(name) + '">' + (open ? 'Hide' : 'Show') + ' ' + closed.length + ' done</button>' : '');
    });
    return '<div class="box" style="overflow:hidden">' + out + '</div>';
  }

  function board(s, flashIds) {
    var cols = [
      { key: 'todo', label: 'To do', pick: function (t) { return t.status === 'todo'; } },
      { key: 'active', label: 'In progress', pick: function (t) { return t.status === 'active'; } },
      { key: 'review', label: 'In review', pick: function (t) { return t.status === 'review'; } },
      { key: 'blocked', label: 'Blocked / failed', pick: function (t) { return t.status === 'blocked' || t.status === 'failed'; } },
      { key: 'done', label: 'Done', pick: function (t) { return t.status === 'done'; } }
    ];
    return '<div class="board">' + cols.map(function (c) {
      var list = s.tasks.filter(c.pick).sort(c.key === 'todo' ? function (a, b) { return (b.ready ? 1 : 0) - (a.ready ? 1 : 0); } : byRecent);
      var limit = c.key === 'done' && !ui.more.done ? 6 : list.length;
      return '<div class="col"><div class="col-hd">' + icon(c.key) + '<span>' + c.label + '</span><span class="n">' + list.length + '</span></div>' +
        (list.length ? list.slice(0, limit).map(function (t) {
          var open = ui.expanded['task:' + t.id], note = taskNote(t), who = t.status === 'review' ? (t.reviewer || t.owner) : t.owner;
          return '<article class="card s-' + t.status + (flashIds[t.id] ? ' flash' : '') + '" id="task-' + esc(t.id) + '" role="button" tabindex="0" data-act="toggle" data-v="task:' + esc(t.id) + '">' +
            '<div class="tid">' + (c.key === 'blocked' ? icon(t.status, 12) : '') + esc(t.id) + (who ? ' ' + owner(who) : '') + '</div><h4>' + esc(t.title) + '</h4>' +
            '<div class="chips">' + taskChips(t, s) + '</div>' + (note && !open ? '<p class="res">' + esc(note) + '</p>' : '') + (open ? taskDetail(t, s) : '') + '</article>';
        }).join('') : '<div class="muted small" style="padding:4px 6px">Nothing here</div>') +
        (list.length > limit ? '<button class="more" data-act="more" data-v="done">Show all ' + list.length + '</button>' : '') + '</div>';
    }).join('') + '</div>';
  }

  function tasksSection(s, flashIds) {
    if (!s.tasks.length) return '';
    return '<section class="sec"><div class="sec-hd"><h2>Tasks<span class="n">' + s.tasks.length + '</span></h2><div class="tabs" role="group" aria-label="View">' +
      '<button data-act="view" data-v="list" aria-pressed="' + (ui.view === 'list') + '">List</button>' +
      '<button data-act="view" data-v="board" aria-pressed="' + (ui.view === 'board') + '">Board</button></div></div>' +
      (ui.view === 'board' ? board(s, flashIds) : listView(s, flashIds)) + '</section>';
  }

  function needsReview(a) { return a.status === 'open' && (a.impact === 'high' || a.confidence === 'low'); }

  function assumptionsSection(s) {
    if (!s.assumptions.length) return '';
    var review = s.assumptions.filter(needsReview).length;
    var open = 'assume' in ui.open ? ui.open.assume : review > 0;
    var rank = { high: 0, medium: 1, low: 2 };
    var list = s.assumptions.slice().sort(function (a, b) {
      if ((a.status === 'open') !== (b.status === 'open')) return a.status === 'open' ? -1 : 1;
      return (needsReview(b) ? 1 : 0) - (needsReview(a) ? 1 : 0) || rank[a.impact] - rank[b.impact];
    });
    var rows = list.map(function (a) {
      var closed = a.status !== 'open', ex = ui.expanded['assume:' + a.id];
      return '<article class="as' + (needsReview(a) ? ' risky' : '') + (closed ? ' closed' : '') + '" id="assume-' + esc(a.id) + '" role="button" tabindex="0" aria-expanded="' + !!ex + '" data-act="toggle" data-v="assume:' + esc(a.id) + '">' +
        '<div class="as-top"><span class="id mono">' + esc(a.id) + '</span><h4' + (ex ? '' : ' class="ell"') + '>' + esc(a.text) + '</h4><span class="chips">' +
        (closed ? '<span class="chip rs-' + esc(a.status) + '">' + cap(esc(a.status)) + '</span>' : '') +
        (!closed && a.confidence === 'low' ? '<span class="chip lvl-low">low confidence</span>' : '') +
        (!closed && a.impact === 'high' ? '<span class="chip lvl-high-impact">high impact</span>' : '') +
        (a.task ? '<button class="link mono" data-act="jump" data-v="task:' + esc(a.task) + '">' + esc(a.task) + '</button>' : '') + '</span></div>' +
        (ex ? '<div class="detail">' +
          '<div><span class="muted">Confidence</span> ' + esc(a.confidence) + ' · <span class="muted">Impact</span> ' + esc(a.impact) + (a.by ? ' · ' + esc(a.by) : '') + '</div>' +
          (a.why ? '<div><span class="muted">Why</span> ' + esc(a.why) + '</div>' : '') +
          (a.alt ? '<div><span class="muted">Alternative</span> ' + esc(a.alt) + '</div>' : '') +
          (a.note ? '<div><span class="muted">Resolution</span> ' + esc(a.note) + '</div>' : '') + '</div>' : '') + '</article>';
    }).join('');
    var meta = s.assumptions.length + (review ? ' · ' + review + ' need review' : '');
    return disc('assume', 'Assumptions', meta, '<div class="box">' + rows + '</div>', open);
  }

  function activitySection(s) {
    if (!s.activity.length) return '';
    var all = s.activity.slice().reverse();
    var shown = ui.more.activity ? all.slice(0, 120) : all.slice(0, 12);
    var body = '<div class="box" style="overflow:hidden">' +
      shown.map(function (e) {
        var g = ST[e.kind] ? icon(e.kind, 12) : '<span class="g">' + (KIND_GLYPH[e.kind] || '•') + '</span>';
        return '<div class="ev k-' + esc(e.kind) + '">' + g + '<div class="t2">' + esc(e.text) + (e.by ? ' <span class="by">· ' + esc(e.by) + '</span>' : '') + '</div><span class="muted">' + esc(ago(e.ts)) + '</span></div>';
      }).join('') +
      (all.length > shown.length ? '<button class="more" data-act="more" data-v="activity">Show more (' + (Math.min(all.length, 120) - shown.length) + ')</button>' : '') + '</div>';
    return disc('activity', 'Activity', all.length + ' events', body, !!ui.open.activity);
  }

  function onboarding() {
    return '<div class="box onboard"><h2>Waiting for the first event</h2><p style="margin-top:6px">Nothing has been logged yet. Tell your agent to use goalpulse, or run:</p>' +
      '<code>goalpulse goal "Ship team billing" --plan docs/plan.md</code>' +
      '<code>goalpulse add "Audit existing billing code" --id T1 --phase Discovery</code>' +
      '<code>goalpulse start T1 --by explorer-1</code></div>';
  }

  /* ---------- goals overview ---------- */

  function goalRank(g) { return g.archived ? 3 : g.health.value === 'complete' ? 2 : g.attention.length ? 0 : 1; }

  function goalRow(g) {
    var p = g.progress, attn = g.attention.length;
    var sum = g.report ? g.report.summary : (g.goal && g.goal.desc) || '';
    return '<div class="gcard" role="button" tabindex="0" data-act="open" data-v="' + esc(g.slug) + '">' +
      ring(p.pct, g.health.value) +
      '<div class="gc-t"><b>' + esc(g.goal ? g.goal.title : g.slug) + '</b><span>' + esc(sum) + '</span></div>' +
      '<span class="hp h-' + esc(g.health.value) + '"><i></i>' + esc(HEALTH[g.health.value] || g.health.value) + '</span>' +
      '<div class="gc-p"><div class="stack">' + stack(g.counts, p.total) + '</div><span>' + p.pct + '%</span></div>' +
      '<span>' + (attn ? '<span class="chip warn">' + attn + ' need' + (attn === 1 ? 's' : '') + ' you</span>' : '') + '</span>' +
      '<span class="when">' + esc(ago(g.updatedAt)) + '</span></div>';
  }

  function overview(goals) {
    var open = goals.filter(function (g) { return !g.archived; });
    var archived = goals.filter(function (g) { return g.archived; });
    open.sort(function (a, b) { return goalRank(a) - goalRank(b) || new Date(b.updatedAt) - new Date(a.updatedAt); });
    var needs = open.reduce(function (n, g) { return n + g.attention.length; }, 0);
    var head = '<div class="gh"><span></span><span>Goal</span><span>Health</span><span>Progress</span><span>Attention</span><span style="text-align:right">Updated</span></div>';
    return '<h1>Goals</h1><p class="sub">' + open.length + ' active' + (needs ? ', ' + needs + ' item' + (needs === 1 ? '' : 's') + ' waiting on you' : '') + '</p>' +
      '<section class="sec"><div class="box" style="overflow:hidden">' + head + open.map(goalRow).join('') +
      (archived.length ? '<button class="more" data-act="archived">' + (ui.showArchived ? 'Hide' : 'Show') + ' archived (' + archived.length + ')</button>' +
        (ui.showArchived ? archived.map(goalRow).join('') : '') : '') + '</div></section>' +
      '<div class="foot">' + goals.length + ' goals' + (conn === 'snapshot' ? '. Static snapshot: run <span class="mono">goalpulse dashboard</span> for live updates.' : '') + '</div>';
  }

  /* ---------- render ---------- */

  // Navigation lives in page state (ui.nav), so it works even where URL hashes do not
  // (sandboxed frames, preview panes). The hash is only an optional deep link.
  function route() {
    if (ui.nav !== undefined) return ui.nav;
    var m = /^#\/([a-z0-9-]+)$/.exec(location.hash);
    return m ? m[1] : null;
  }

  function navigate(slug) {
    ui.nav = slug; // a goal slug, or null for the overview
    try { location.hash = slug ? '#/' + slug : ''; } catch (e) { /* hash not available here: state is enough */ }
    render();
    window.scrollTo(0, 0);
  }

  function shell(goals, cur, title, inner, multi) {
    return '<div class="app' + (multi ? '' : ' solo') + '">' + (multi ? sidebar(goals, cur) : '') +
      '<div class="main">' + topbar(multi, title) + '<div class="page">' + inner + '</div></div></div>';
  }

  function render() {
    var app = document.getElementById('app');
    var a = document.activeElement, fa = a && a.getAttribute && a.getAttribute('data-act'), fv = a && a.getAttribute && a.getAttribute('data-v');
    paint(app);
    if (fa) { // keep keyboard focus on the same control across re-renders
      var el = Array.prototype.filter.call(document.querySelectorAll('[data-act]'), function (n) { return n.getAttribute('data-act') === fa && n.getAttribute('data-v') === fv; })[0];
      if (el && el !== document.activeElement) el.focus({ preventScroll: true });
    }
  }

  function paint(app) {
    if (!data) {
      app.innerHTML = '<div class="page muted">' + (conn === 'offline' ? 'Cannot reach the goalpulse server. Is <span class="mono">goalpulse dashboard</span> running?' : 'Loading') + '</div>';
      return;
    }
    var goals = data.goals || [];
    var slug = route();
    var cur = null;
    if (slug) cur = goals.filter(function (g) { return g.slug === slug; })[0] || null;
    else if (goals.length === 1) cur = goals[0];
    var multi = goals.length > 1;
    var y0 = window.scrollY;

    if (!goals.length) {
      app.innerHTML = shell(goals, null, 'No goals yet', '<h1>No goals yet</h1><section class="sec">' + onboarding() + '</section>', false);
      document.title = 'Goal progress';
    } else if (!cur && slug) {
      app.innerHTML = shell(goals, null, 'Not found', '<p class="muted">No goal called <span class="mono">' + esc(slug) + '</span>.</p>', multi);
    } else if (!cur) {
      app.innerHTML = shell(goals, null, 'All goals', overview(goals), true);
      document.title = 'Goals · ' + goals.length;
    } else {
      state = cur;
      renderGoal(app, goals, multi);
    }
    window.scrollTo(0, y0);
  }

  function renderGoal(app, goals, multi) {
    if (seenGoal !== state.slug) { // switching goals: drop per-goal UI state and change tracking
      seen = null; seenGoal = state.slug;
      ui.expanded = {}; ui.more = {}; ui.open = {};
    }
    // Which tasks changed since the last render (not on first paint).
    var flashIds = {};
    var now = {};
    state.tasks.forEach(function (t) { now[t.id] = t.status + '|' + t.updatedAt; if (seen && seen[t.id] !== now[t.id]) flashIds[t.id] = true; });
    seen = now;

    var empty = !state.goal && !state.tasks.length;
    var inner = header(state) + (empty ? '' : summary(state)) + (empty ? '<section class="sec">' + onboarding() + '</section>' :
      attention(state) + reportSection(state) + tasksSection(state, flashIds) + assumptionsSection(state) + activitySection(state) +
      '<div class="foot">' + state.rev + ' events' + (conn === 'snapshot' ? '. Static snapshot: run <span class="mono">goalpulse dashboard</span> for live updates.' : '') + '</div>');
    app.innerHTML = shell(goals, state, state.goal ? state.goal.title : state.slug, inner, multi);
    document.title = (state.attention.length ? '(' + state.attention.length + ') ' : '') + (state.progress.total ? state.progress.pct + '% · ' : '') + (state.goal ? state.goal.title : 'Goal progress');
  }

  function jump(target) {
    var parts = target.split(':');
    if (parts[0] === 'assume') { ui.open.assume = true; ui.expanded[target] = true; }
    if (parts[0] === 'task') {
      ui.expanded[target] = true;
      state.tasks.forEach(function (t) { if (t.id === parts[1]) ui.more['p:' + phaseOf(t)] = true; });
    }
    render();
    var el = document.getElementById((parts[0] === 'assume' ? 'assume-' : 'task-') + parts[1]);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('flash');
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (act === 'view') { ui.view = v; try { localStorage.setItem('gp.view', v); } catch (x) {} render(); }
    else if (act === 'sect') { ui.open[v] = !(v in ui.open ? ui.open[v] : v === 'assume' && state.assumptions.some(needsReview)); render(); }
    else if (act === 'toggle') { if (e.target.closest('.detail')) return; ui.expanded[v] = !ui.expanded[v]; render(); }
    else if (act === 'more') { ui.more[v] = true; render(); }
    else if (act === 'jump') { e.stopPropagation(); jump(v); }
    else if (act === 'archived') { ui.showArchived = !ui.showArchived; render(); }
    else if (act === 'open') navigate(v);
    else if (act === 'home') navigate(null);
  });

  // Keyboard: Enter / Space activates anything that acts as a button.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target;
    if (!el || !el.getAttribute || el.getAttribute('role') !== 'button') return;
    e.preventDefault();
    el.click();
  });

  /* ---------- data ---------- */

  function sigOf(d) { return (d.goals || []).map(function (g) { return g.slug + ':' + g.rev + ':' + g.archived; }).join('|'); }

  function poll() {
    fetch('api/goals', { headers: { Accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        var changed = !data || sigOf(d) !== sigOf(data) || conn !== 'live';
        data = d; conn = 'live';
        if (changed) render();
      })
      .catch(function () { if (conn !== 'offline') { conn = 'offline'; render(); } });
  }

  // When the hash changes (back/forward, a pasted deep link) it becomes the source of truth again.
  window.addEventListener('hashchange', function () { ui.nav = undefined; render(); window.scrollTo(0, 0); });
  render();
  if (LIVE) { poll(); setInterval(poll, 2000); }
  setInterval(function () { if (data) render(); }, 15000); // keep "x ago" labels fresh
})();
</script>
</body>
</html>
